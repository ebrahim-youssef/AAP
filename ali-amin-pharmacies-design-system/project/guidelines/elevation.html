<!-- @dsCard group="Spacing" viewport="700x170" name="Borders & elevation" subtitle="Flat by default; the only shadow is the sheet" -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-primary);background:#fff}.m{font-size:11px;color:var(--text-secondary);direction:ltr;text-align:right;font-family:ui-monospace,Menlo,monospace}.b{padding:16px;font-size:12px;color:var(--text-secondary);display:grid;gap:10px;align-content:start}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px;height:170px;box-sizing:border-box;background:var(--surface-sunken)"><div class="b" style="background:#fff;box-shadow:inset 0 -1px var(--border-hairline)"><b style="color:var(--text-primary)">Hairline</b>1px #E6EAF0 between rows and bars</div><div class="b" style="background:#fff;border:1px solid var(--border-control);border-radius:10px"><b style="color:var(--text-primary)">Control</b>1px #D7DEE7 branch cards, light chips</div><div class="b" style="background:#fff;border:1.5px solid var(--border-tag);border-radius:10px"><b style="color:var(--text-primary)">Tag</b>1.5px ink — price tag only</div><div class="b" style="background:#fff;border-radius:18px 18px 0 0;box-shadow:var(--shadow-sheet);align-self:end"><b style="color:var(--text-primary)">Sheet</b>0 -8px 24px navy 12%</div></div></body></html>
