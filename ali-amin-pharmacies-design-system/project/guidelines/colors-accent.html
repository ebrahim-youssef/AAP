<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-primary);background:#fff}.m{font-size:11px;color:var(--text-secondary);direction:ltr;text-align:right;font-family:ui-monospace,Menlo,monospace}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 2fr;height:150px"><div style="background:var(--yellow-400);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ink-900);"><b style="font-size:13px">Shelf yellow</b><span style="font-size:11px;direction:ltr;text-align:right;opacity:.85">--yellow-400<br>#FFC629</span></div><div style="background:var(--yellow-100);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ink-900);"><b style="font-size:13px">Warning tint</b><span style="font-size:11px;direction:ltr;text-align:right;opacity:.85">--yellow-100<br>#FFF4D1</span></div><div style="padding:18px;display:grid;gap:10px;align-content:center;font-size:13px;line-height:1.6;color:var(--text-secondary)"><span class="aa-tag aa-tag--check" style="justify-self:start">يلزم تأكيد</span>Yellow never becomes a button, a sale badge or a background. One yellow moment per screen.</div></div></body></html>
